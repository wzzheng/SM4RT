pretrained: ./checkpoints/DA3.pt
load_only_encoder: False
long_context: False
fixed_length: True
resume: Null
benchmark: False
num_views: 24
num_test_views : 4
n_corres_train: 0
n_corres_test: 0

train_criterion: MultiTaskLoss()
test_criterion: MultiTaskLoss()
allow_repeat: False

dataset0: Kubric_Motion(allow_repeat=${allow_repeat}, split='train', ROOT='PATH', 
  aug_crop=16, resolution=[(518, 518)], 
  transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})

dataset2: PointOdyssey(allow_repeat=${allow_repeat}, split='train', ROOT='PATH', 
  aug_crop=16, resolution=[(518, 294)], 
  transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})

dataset3: DynamicReplica(allow_repeat=${allow_repeat}, split='train', ROOT='PATH', 
  aug_crop=16, resolution=[(518, 294)], 
  transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})

dataset4: VKITTI2(allow_repeat=${allow_repeat}, split='train', ROOT='PATH', 
  aug_crop=16, resolution=[(518, 294)], 
  transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})

dataset5: Stereo4D(allow_repeat=${allow_repeat}, split='train', ROOT='PATH', 
  aug_crop=16, resolution=[(518, 518)], 
  transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})


